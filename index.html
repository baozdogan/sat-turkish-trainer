// GitHub Pages update helper. Future releases only need a new APP_VERSION/meta version.
async function checkForAppUpdate(forceReload = false) {
  const status = document.getElementById('updateStatus');
  try {
    if (status) status.textContent = 'Checking…';
    const freshUrl = new URL('./index.html', window.location.href);
    freshUrl.searchParams.set('_update', Date.now().toString());
    const response = await fetch(freshUrl.toString(), { cache: 'no-store' });
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const html = await response.text();
    const match = html.match(/<meta\s+name=["']sat-app-version["']\s+content=["']([^"']+)["']/i);
    const remoteVersion = match ? match[1] : null;

    if (remoteVersion && remoteVersion !== APP_VERSION) {
      if (status) status.textContent = 'New version ' + remoteVersion + ' found — updating…';
      const reloadUrl = new URL(window.location.href);
      reloadUrl.searchParams.set('v', remoteVersion);
      reloadUrl.searchParams.set('_fresh', Date.now().toString());
      window.location.replace(reloadUrl.toString());
      return true;
    }

    if (forceReload) {
      const reloadUrl = new URL(window.location.href);
      reloadUrl.searchParams.set('v', remoteVersion || APP_VERSION);
      reloadUrl.searchParams.set('_fresh', Date.now().toString());
      window.location.replace(reloadUrl.toString());
      return true;
    }

    if (status) status.textContent = 'Up to date';
  } catch (err) {
    if (status) status.textContent = 'Update check failed';
    console.warn('Update check failed:', err);
  }
  return false;
}

document.getElementById('forceUpdateBtn')?.addEventListener('click', () => checkForAppUpdate(true));
window.addEventListener('load', () => setTimeout(() => checkForAppUpdate(false), 800));
document.addEventListener('visibilitychange', () => {

});

"word": "arcane", "meaning": "obscure, secret, known only by a few", "turkish": "arka", "memory": "Bilgi arkada saklı ve sadece birkaç kişi biliyor → arcane."}, {"word": "archaic", "meaning": "of an earlier period in time; outdated", "turkish": "arkaik", "memory": "Türkçedeki arkaik → çok eski, modası geçmiş."}, {"word": "archetypal", "meaning": "the most representative or typical example", "turkish": "arketip", "memory": "Türkçedeki arketip → en tipik, örnek niteliğinde."}, {"word": "ardor", "meaning": "extreme vigor, energy, or enthusiasm", "turkish": "hararet", "memory": "Büyük hararet ve enerjiyle yapmak → ardor = coşku, tutku."}, {"word": "arid", "meaning": "excessively dry", "turkish": "arıd / kuru", "memory": "Su yok, kupkuru bir yer düşün → arid = aşırı kurak."}, {"word": "arrogate", "meaning": "to take without justification", "turkish": "arrogant alır", "memory": "Arrogant biri hakkı olmadan alıyor → arrogate."}, {"word": "artifact", "meaning": "a remaining object or piece from an earlier culture or place", "turkish": "artefakt", "memory": "Türkçede de artefakt → geçmişten kalan insan yapımı nesne."}, {"word": "artisan", "meaning": "a craftsman", "turkish": "art insanı", "memory": "Art insanı = el sanatları ustası → artisan."}, {"word": "ascertain", "meaning": "to perceive, learn, or determine", "turkish": "a certain", "memory": "Bir şeyi certain/kesin hale getir → ascertain = öğrenmek, belirlemek."}, {"word": "ascetic", "meaning": "practicing restraint as a means of self-discipline, usually religious", "turkish": "asketik", "memory": "Asketik yaşam → zevklerden uzak, disiplinli yaşam."}, {"word": "ascribe", "meaning": "to assign, credit, or attribute to", "turkish": "a-scribe", "memory": "Bir şeyi yazıp bir kaynağa bağlamak → ascribe = atfetmek."}, {"word": "aspersion", "meaning": "a curse or expression of ill will; a damaging remark", "turkish": "üstüne kötü söz serp", "memory": "Birinin üstüne kötü söz serpiyor → aspersion = kötüleme, iftira."}, {"word": "aspire", "meaning": "to long for or aim toward", "turkish": "aspirasyon", "memory": "Bir hedefe doğru yükselmeyi arzulamak → aspire."}, {"word": "assail", "meaning": "to attack", "turkish": "a-saldır!", "memory": "'Saldır!' sesini hatırla → assail = saldırmak."}, {"word": "assess", "meaning": "to evaluate", "turkish": "ölç, değerlendir", "memory": "Bir şeyi ölçüp değerlendir → assess."}, {"word": "assiduous", "meaning": "hard-working and diligent", "turkish": "işe asıldı", "memory": "İşe asıldı, sürekli ve dikkatli çalışıyor → assiduous."}, {"word": "assuage", "meaning": "to ease, calm, or pacify", "turkish": "azıcık su ver", "memory": "'Azıcık su ver, sakinleşsin' → assuage = hafifletmek, yatıştırmak."}, {"word": "astute", "meaning": "very clever; shrewd; crafty", "turkish": "az tut", "memory": "Akıllıysan 'az tut', dikkatli davran → astute = çok zeki / kurnaz."}, {"word": "asylum", "meaning": "a place of refuge, protection, or sanctuary", "turkish": "asıl yerim", "memory": "Güvenli 'asıl yerim' burası → asylum = sığınak / korunak."}, {"word": "atone", "meaning": "to repent; make amends", "turkish": "Ata onu", "memory": "Ata onu üzdü, şimdi özür dileyip telafi ediyor → atone = hatasını telafi etmek."}, {"word": "atrophy", "meaning": "to wither away; decay; waste away", "turkish": "et eriyor", "memory": "Kullanmayınca et/kas eriyor → atrophy = körelmek / erimek."}, {"word": "attain", "meaning": "to achieve; reach; arrive at", "turkish": "at, dayan", "memory": "'At, dayan!' Hedefe kadar dayan → attain = ulaşmak / başarmak."}, {"word": "attribute", "meaning": "to credit or assign; a feature or trait", "turkish": "Ata tribute", "memory": "Başarıyı Ata'ya tribute ediyor → attribute = atfetmek; özellik."}, {"word": "atypical", "meaning": "not typical; unusual", "turkish": "a-tipik", "memory": "'A-tipik' = tipik değil → atypical = alışılmadık."}, {"word": "audacious", "meaning": "excessively bold; daring", "turkish": "o da cesur", "memory": "'O da cesur!' → audacious = aşırı cesur / cüretkâr."}, {"word": "audible", "meaning": "able to be heard", "turkish": "audio bul", "memory": "Audioyu bul, sesi duy → audible = duyulabilir."}, {"word": "augment", "meaning": "to add to; increase; expand", "turkish": "artır", "memory": "Miktarı artır → augment = artırmak / genişletmek."}, {"word": "auspicious", "meaning": "favorable; promising; indicating good things", "turkish": "oh, süper iş", "memory": "'Oh, süper iş!' İyiye işaret → auspicious = uğurlu / olumlu."}, {"word": "austere", "meaning": "very bare, plain, strict, or severe", "turkish": "az süs", "memory": "'Az süs' → austere = sade, çıplak, sert."}, {"word": "avarice", "meaning": "excessive greed", "turkish": "avarız, isteriz", "memory": "Hep daha fazlasını ister → avarice = aşırı açgözlülük."}, {"word": "avenge", "meaning": "to seek or take revenge", "turkish": "avını geç", "memory": "Peşine düşüp intikam al → avenge = intikamını almak."}, {"word": "aversion", "meaning": "a strong dislike", "turkish": "aversin", "memory": "'Aversin!' Ondan hoşlanmıyorsun → aversion = güçlü nefret / hoşnutsuzluk."}, {"word": "balk", "meaning": "to stop, refuse, or block abruptly", "turkish": "bırak", "memory": "'Bırak!' deyip bir anda durdu → balk = aniden durmak / reddetmek."}, {"word": "ballad", "meaning": "a narrative or love song", "turkish": "balad", "memory": "Türkçedeki 'balad' gibi → ballad = hikâye veya aşk şarkısı."}, {"word": "banal", "meaning": "dull; commonplace; unoriginal", "turkish": "banal", "memory": "Türkçede de banal → sıradan / sıkıcı."}, {"word": "bane", "meaning": "a burden; cause of misery or ruin", "turkish": "beynime bela", "memory": "'Beynime bela!' → bane = hayatı zorlaştıran bela / sıkıntı."}, {"word": "bard", "meaning": "a poet, often also a singer", "turkish": "bar'da şair", "memory": "Bar'da şiir söyleyen şair → bard = ozan / şair."}, {"word": "bashful", "meaning": "shy; excessively timid", "turkish": "baş full kızardı", "memory": "Utanınca başı/yüzü kıpkırmızı oldu → bashful = utangaç."}, {"word": "battery", "meaning": "a device that supplies power; also assault or beating", "turkish": "batarya", "memory": "Türkçedeki batarya → battery = pil/batarya; ayrıca saldırı/darp."}, {"word": "beguile", "meaning": "to trick, deceive, or charm", "turkish": "bir gül", "memory": "'Bir gül' ile kandırdı → beguile = kandırmak / büyülemek."}, {"word": "behemoth", "meaning": "something of tremendous size or power", "turkish": "büyük mammoth", "memory": "Mammoth gibi devasa → behemoth = çok büyük ve güçlü şey."}, {"word": "benign", "meaning": "mild; harmless; favorable; not threatening", "turkish": "beni yenmez", "memory": "'Beni yenmez' çünkü zararsız → benign = iyi huylu / tehlikesiz."}, {"word": "bequeath", "meaning": "to pass on or leave to someone, especially by will", "turkish": "bir kuşağa bırak", "memory": "Malını bir sonraki kuşağa bırak → bequeath = miras bırakmak."}, {"word": "berate", "meaning": "to scold vehemently", "turkish": "biraz rahat", "memory": "Patron bağırıyor: 'Biraz rahat!' → berate = sertçe azarlamak."}, {"word": "bereft", "meaning": "deprived of; without", "turkish": "bir evden mahrum", "memory": "Bir evden mahrum kaldı → bereft = yoksun / mahrum."}, {"word": "beseech", "meaning": "to beg, plead, or implore", "turkish": "bizi seç", "memory": "'Bizi seç!' diye yalvarıyor → beseech = yalvarmak."}, {"word": "bias", "meaning": "a tendency, inclination, or prejudice", "turkish": "bir yana bas", "memory": "Bir yana basıyor, tarafsız değil → bias = önyargı / eğilim."}];
const savedWords = JSON.parse(localStorage.getItem('satWords') || 'null') || [];
const savedMap = new Map(savedWords.map(w => [w.word.toLowerCase(), w]));
starter.forEach(w => savedMap.set(w.word.toLowerCase(), w)); // latest built-in definitions override stale cached copies
let words = Array.from(savedMap.values()).sort((a,b)=>a.word.localeCompare(b.word));
let known = new Set(JSON.parse(localStorage.getItem('satKnown') || '[]'));
let fi=0,qcur=null,tcur=null;

function save(){localStorage.setItem('satWords',JSON.stringify(words));localStorage.setItem('satKnown',JSON.stringify([...known]));}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active');if(b.dataset.tab==='quiz')newQuiz();if(b.dataset.tab==='typing')newType();if(b.dataset.tab==='bank')renderBank();});

function renderFlash(){if(!words.length)return; if(fi>=words.length)fi=0;const w=words[fi];flashCount.textContent=`Card ${fi+1} of ${words.length} • Known ${known.size}`;flashWord.textContent=w.word;flashMeaning.textContent=w.meaning;flashHint.textContent='Turkish clue: '+w.turkish;flashMemory.textContent=w.memory;flashAnswer.style.display='none';showBtn.style.display='inline-block';againBtn.style.display=knowBtn.style.display='none';}
showBtn.onclick=()=>{flashAnswer.style.display='block';showBtn.style.display='none';againBtn.style.display=knowBtn.style.display='inline-block';};
againBtn.onclick=()=>{known.delete(words[fi].word);fi=(fi+1)%words.length;save();renderFlash();};
knowBtn.onclick=()=>{known.add(words[fi].word);fi=(fi+1)%words.length;save();renderFlash();};

function newQuiz(){if(words.length<4)return;quizFeedback.textContent='';nextQuiz.style.display='none';choices.innerHTML='';qcur=words[Math.floor(Math.random()*words.length)];quizWord.textContent=qcur.word;let opts=shuffle([qcur,...shuffle(words.filter(x=>x.word!==qcur.word)).slice(0,3)]);opts.forEach(w=>{let b=document.createElement('button');b.className='choice';b.textContent=w.meaning;b.onclick=()=>{[...choices.children].forEach(x=>x.disabled=true);if(w.word===qcur.word){b.classList.add('correct');quizFeedback.textContent='Correct! '+qcur.memory;}else{b.classList.add('wrong');[...choices.children].forEach(x=>{if(x.textContent===qcur.meaning)x.classList.add('correct')});quizFeedback.textContent='Correct answer: '+qcur.meaning+' — '+qcur.memory;}nextQuiz.style.display='inline-block';};choices.appendChild(b);});}
nextQuiz.onclick=newQuiz;

function newType(){tcur=words[Math.floor(Math.random()*words.length)];typeMeaning.textContent=tcur.meaning;typeHint.textContent='Turkish clue: '+tcur.turkish;typeInput.value='';typeInput.disabled=false;typeFeedback.textContent='';checkType.style.display='inline-block';nextType.style.display='none';}
checkType.onclick=()=>{let ok=typeInput.value.trim().toLowerCase()===tcur.word.toLowerCase();typeFeedback.textContent=ok?'Correct! '+tcur.memory:'Correct word: '+tcur.word+' — '+tcur.memory;typeInput.disabled=true;checkType.style.display='none';nextType.style.display='inline-block';};
nextType.onclick=newType;

function renderBank(){let q=search.value.toLowerCase();wordList.innerHTML='';words.filter(w=>(w.word+' '+w.meaning+' '+w.turkish).toLowerCase().includes(q)).forEach(w=>{let d=document.createElement('div');d.className='row';d.innerHTML='<b>'+w.word+'</b> — '+w.meaning+'<br><span class="small">Turkish: '+w.turkish+' | '+w.memory+'</span>';wordList.appendChild(d);});}
search.oninput=renderBank;

addBtn.onclick=()=>{let w={word:newWord.value.trim(),meaning:newMeaning.value.trim(),turkish:newTurkish.value.trim(),memory:newMemory.value.trim()};if(!w.word||!w.meaning)return alert('Enter at least a word and meaning.');words.push(w);save();[newWord,newMeaning,newTurkish,newMemory].forEach(x=>x.value='');alert('Word added.');renderFlash();};
exportBtn.onclick=()=>{let blob=new Blob([JSON.stringify(words,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sat-word-list.json';a.click();};
resetBtn.onclick=()=>{if(confirm('Reset the word list?')){words=starter;known=new Set();save();renderFlash();}};
save();renderFlash();
</script></body></html>
