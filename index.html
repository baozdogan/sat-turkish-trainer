<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SAT Turkish Sound Similarities – A Words</title>
<style>
:root {
  --bg:#f6f7fb; --card:#fff; --text:#18202a; --muted:#667085;
  --accent:#3157d5; --ok:#137a4b; --bad:#b42318; --border:#e5e7eb;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:14px 16px}
header h1{font-size:19px;margin:0 0 4px} header p{margin:0;color:var(--muted);font-size:13px}
.wrap{max-width:820px;margin:auto;padding:16px}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
button{border:0;border-radius:12px;padding:11px 14px;font-weight:700;cursor:pointer}
.tab{background:#e9edf7;color:#2b3a55} .tab.active{background:var(--accent);color:white}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;box-shadow:0 6px 20px rgba(0,0,0,.04);margin-bottom:14px}
.word{font-size:30px;font-weight:800;margin:0 0 6px}
.meaning{font-size:16px;color:#344054;margin-bottom:14px}
.hook{font-size:22px;font-weight:800;color:var(--accent);margin:8px 0}
.mnemonic{font-size:16px;line-height:1.45}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.primary{background:var(--accent);color:white} .secondary{background:#eef2ff;color:#273a8a}
.progress{font-size:13px;color:var(--muted);margin-bottom:8px}
.search{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:12px;font-size:16px;margin-bottom:12px}
.item{padding:14px 0;border-bottom:1px solid var(--border)} .item:last-child{border-bottom:0}
.item b{font-size:18px} .small{color:var(--muted);font-size:14px;margin-top:4px}
.quizq{font-size:20px;font-weight:800;margin-bottom:12px}
.option{display:block;width:100%;text-align:left;background:#f2f4f7;color:var(--text);margin:8px 0}
.option.correct{background:#dff4e8;color:var(--ok)} .option.wrong{background:#fde7e5;color:var(--bad)}
input, textarea{font:inherit}
.addgrid{display:grid;gap:10px} .addgrid input{padding:11px;border:1px solid var(--border);border-radius:10px}
.footer{text-align:center;color:var(--muted);font-size:12px;padding:10px 0 30px}
.hidden{display:none}
</style>
</head>
<body>
<header>
  <h1>SAT Turkish Sound Similarities</h1>
  <p>44 words • Pages 5–7 • Practice on iPhone</p>
</header>
<div class="wrap">
  <div class="tabs">
    <button class="tab active" data-tab="cards">Flashcards</button>
    <button class="tab" data-tab="list">Word List</button>
    <button class="tab" data-tab="quiz">Quiz</button>
    <button class="tab" data-tab="add">Add Word</button>
  </div>

  <section id="cards">
    <div class="progress" id="progress"></div>
    <div class="card">
      <div class="word" id="cardWord"></div>
      <div class="meaning" id="cardMeaning"></div>
      <div id="answer" class="hidden">
        <div class="small">Turkish sound similarity</div>
        <div class="hook" id="cardHook"></div>
        <div class="mnemonic" id="cardMnemonic"></div>
      </div>
      <div class="row">
        <button class="primary" id="showBtn">Show Turkish Hook</button>
        <button class="secondary" id="prevBtn">← Previous</button>
        <button class="secondary" id="nextBtn">Next →</button>
      </div>
    </div>
  </section>

  <section id="list" class="hidden">
    <input class="search" id="search" placeholder="Search word, meaning or Turkish hook…">
    <div class="card" id="listBox"></div>
  </section>

  <section id="quiz" class="hidden">
    <div class="card">
      <div class="progress" id="quizProgress"></div>
      <div class="quizq" id="quizQ"></div>
      <div id="options"></div>
      <div class="row"><button class="primary hidden" id="nextQuiz">Next Question</button></div>
    </div>
  </section>

  <section id="add" class="hidden">
    <div class="card">
      <h2 style="margin-top:0">Add a new word</h2>
      <div class="addgrid">
        <input id="newWord" placeholder="English word">
        <input id="newMeaning" placeholder="Meaning">
        <input id="newHook" placeholder="Turkish sound similarity">
        <input id="newMnemonic" placeholder="Mnemonic sentence">
        <button class="primary" id="addBtn">Add Word</button>
      </div>
      <p class="small">New words are saved on this device/browser using local storage.</p>
    </div>
  </section>

  <div class="footer">Built from your SAT vocabulary pages • Turkish sound hooks are memory aids, not translations.</div>
</div>

<script>
const starter = [{"word": "aggregate", "meaning": "a whole or total; to gather into a mass", "turkish": "agrega / agregat", "mnemonic": "Hepsini bir araya getirip bir agregat/toplam oluştur."}, {"word": "aggrieved", "meaning": "distressed, wronged, injured", "turkish": "ağrıdı", "mnemonic": "Haksızlığa uğradı, canı 'ağrıdı' → aggrieved."}, {"word": "agile", "meaning": "quick, nimble", "turkish": "acil", "mnemonic": "Acil durumda hızlı ve çevik ol → agile."}, {"word": "agnostic", "meaning": "believing that God's existence cannot be proven or disproven", "turkish": "agnostik", "mnemonic": "Türkçede de 'agnostik' kullanılır."}, {"word": "agriculture", "meaning": "farming", "turkish": "agri-kültür", "mnemonic": "Tarım bir 'agri kültürü' gibi düşün → agriculture."}, {"word": "aisle", "meaning": "passageway between rows of seats", "turkish": "ayıl", "mnemonic": "Uçakta 'ayıl' ve koridordan yürü → aisle."}, {"word": "alacrity", "meaning": "eagerness, speed", "turkish": "ala-kıriti", "mnemonic": "İşi 'ala kıriti' hızla ve hevesle yap → alacrity."}, {"word": "alias", "meaning": "a false name or identity", "turkish": "alyas", "mnemonic": "Takma ad = alias; Türkçedeki 'alyas' sesine yakın."}, {"word": "allay", "meaning": "to soothe, ease", "turkish": "alay", "mnemonic": "Kalabalığı sakinleştir, 'alay' yatışsın → allay."}, {"word": "allege", "meaning": "to assert, usually without proof", "turkish": "öylece", "mnemonic": "Kanıt yok, 'öylece' iddia ediyor → allege."}, {"word": "alleviate", "meaning": "to relieve, make more bearable", "turkish": "hafiflet", "mnemonic": "Alleviate = acıyı hafiflet; 'alevi' azaltır gibi düşün."}, {"word": "allocate", "meaning": "to distribute, set aside", "turkish": "aloket", "mnemonic": "Kaynakları 'alo, ket ket dağıt' → allocate."}, {"word": "aloof", "meaning": "reserved, distant", "turkish": "alo yok", "mnemonic": "Uzak ve soğuk; 'alo' desen cevap yok → aloof."}, {"word": "altercation", "meaning": "a dispute, fight", "turkish": "alter-kavga", "mnemonic": "Bir 'alter' kavgası çıktı → altercation."}, {"word": "amalgamate", "meaning": "to bring together, unite", "turkish": "amalga-mat", "mnemonic": "Parçaları tek bir 'mat' üzerinde birleştir → amalgamate."}, {"word": "ambiguous", "meaning": "uncertain, open to more than one interpretation", "turkish": "ambi-giz", "mnemonic": "Anlamı 'gizli', iki türlü yorumlanıyor → ambiguous."}, {"word": "ambivalent", "meaning": "having opposing feelings", "turkish": "ambi-valans", "mnemonic": "Duygular iki yöne 'valans' yapıyor → ambivalent."}, {"word": "ameliorate", "meaning": "to improve", "turkish": "ameliyat", "mnemonic": "Ameliyat sonrası durum iyileşti → ameliorate."}, {"word": "amenable", "meaning": "willing, compliant", "turkish": "amen / eyvallah", "mnemonic": "Her şeye 'amen/eyvallah' diyor, uyumlu → amenable."}, {"word": "amenity", "meaning": "an item or feature that increases comfort", "turkish": "ameniti", "mnemonic": "Oteldeki konfor sağlayan imkanlar = amenities."}, {"word": "amiable", "meaning": "friendly", "turkish": "ami / amigo", "mnemonic": "Amigo gibi dost canlısı → amiable."}, {"word": "amicable", "meaning": "friendly, without hard feelings", "turkish": "amca-bile", "mnemonic": "Amca bile dostça davrandı → amicable."}, {"word": "amorous", "meaning": "showing love, especially romantic/sexual love", "turkish": "amor", "mnemonic": "'Amor' = aşk; amorous = aşıkane."}, {"word": "amorphous", "meaning": "without definite shape or type", "turkish": "amorf", "mnemonic": "Türkçede 'amorf' = şekilsiz."}, {"word": "anachronistic", "meaning": "out of correct chronological order", "turkish": "anakronik", "mnemonic": "Türkçede 'anakronik' ile aynı kök."}, {"word": "analgesic", "meaning": "something that reduces pain", "turkish": "analjezik", "mnemonic": "Türkçede 'analjezik' = ağrı kesici."}, {"word": "analogous", "meaning": "similar, comparable", "turkish": "analog", "mnemonic": "Analog şeyler birbirine benzer → analogous."}, {"word": "anarchist", "meaning": "one who wants to eliminate government", "turkish": "anarşist", "mnemonic": "Türkçede de 'anarşist'."}, {"word": "anathema", "meaning": "a cursed or detested person/thing", "turkish": "ana tema", "mnemonic": "Nefret edilen 'ana tema' → anathema."}, {"word": "anecdote", "meaning": "a short, humorous or interesting account", "turkish": "anekdot", "mnemonic": "Türkçede 'anekdot'."}, {"word": "anesthesia", "meaning": "loss of sensation", "turkish": "anestezi", "mnemonic": "Türkçede 'anestezi'."}, {"word": "anguish", "meaning": "extreme sadness or torment", "turkish": "angut iş", "mnemonic": "Bu 'angut iş' bana büyük sıkıntı verdi → anguish."}, {"word": "animated", "meaning": "lively", "turkish": "anime", "mnemonic": "Anime karakterleri canlı ve hareketli → animated."}, {"word": "annex", "meaning": "to add/incorporate; an attached room/section", "turkish": "anneks", "mnemonic": "Türkçede 'aneks' = ek bölüm."}, {"word": "annul", "meaning": "to make void or invalid", "turkish": "iptal", "mnemonic": "Annul = iptal etmek; 'an-null' = sıfıra indir."}, {"word": "anomaly", "meaning": "something outside the normal order", "turkish": "anomali", "mnemonic": "Türkçede 'anomali'."}, {"word": "anonymous", "meaning": "unknown, unnamed", "turkish": "anonim", "mnemonic": "Türkçede 'anonim'."}, {"word": "antagonism", "meaning": "hostility, opposition", "turkish": "antagonizma", "mnemonic": "Türkçede 'antagonizma' = karşıtlık."}, {"word": "antecedent", "meaning": "something that came before", "turkish": "önce", "mnemonic": "Ante = önce; antecedent = önce gelen."}, {"word": "antediluvian", "meaning": "ancient, extremely old", "turkish": "anti-diluvyan", "mnemonic": "Tufandan (deluge) önceki kadar eski → antediluvian."}, {"word": "anthology", "meaning": "a selected collection of writings, songs, etc.", "turkish": "antoloji", "mnemonic": "Türkçede 'antoloji'."}, {"word": "antipathy", "meaning": "a strong dislike", "turkish": "antipati", "mnemonic": "Türkçede 'antipati'."}, {"word": "antiquated", "meaning": "old, out of date", "turkish": "antika", "mnemonic": "Antika gibi eski ve modası geçmiş → antiquated."}, {"word": "antiseptic", "meaning": "clean, sterile; preventing infection", "turkish": "antiseptik", "mnemonic": "Türkçede 'antiseptik'."}];
let custom = JSON.parse(localStorage.getItem('satCustomWords') || '[]');
let words = [...starter, ...custom];
let i = 0, qIndex = 0, qScore = 0;

function renderCard() {
  if (!words.length) return;
  const w = words[i];
  document.getElementById('progress').textContent = `Word ${i+1} of ${words.length}`;
  document.getElementById('cardWord').textContent = w.word;
  document.getElementById('cardMeaning').textContent = w.meaning;
  document.getElementById('cardHook').textContent = w.turkish;
  document.getElementById('cardMnemonic').textContent = w.mnemonic;
  document.getElementById('answer').classList.add('hidden');
  document.getElementById('showBtn').textContent = 'Show Turkish Hook';
}
document.getElementById('showBtn').onclick = () => {
  const a = document.getElementById('answer');
  a.classList.toggle('hidden');
  document.getElementById('showBtn').textContent = a.classList.contains('hidden') ? 'Show Turkish Hook' : 'Hide Hook';
};
document.getElementById('prevBtn').onclick = () => { i=(i-1+words.length)%words.length; renderCard(); };
document.getElementById('nextBtn').onclick = () => { i=(i+1)%words.length; renderCard(); };

function renderList(filter='') {
  const f=filter.toLowerCase();
  const filtered=words.filter(w => Object.values(w).join(' ').toLowerCase().includes(f));
  document.getElementById('listBox').innerHTML = filtered.map(w => `
    <div class="item"><b>${w.word}</b>
      <div>${w.meaning}</div>
      <div class="hook">${w.turkish}</div>
      <div class="small">${w.mnemonic}</div>
    </div>`).join('');
}
document.getElementById('search').oninput = e => renderList(e.target.value);

function shuffle(a) { return [...a].sort(()=>Math.random()-.5); }
function renderQuiz() {
  const w = words[Math.floor(Math.random()*words.length)];
  const wrong = shuffle(words.filter(x=>x.word!==w.word)).slice(0,3).map(x=>x.meaning);
  const choices = shuffle([w.meaning,...wrong]);
  document.getElementById('quizProgress').textContent = `Score: ${qScore} / ${qIndex}`;
  document.getElementById('quizQ').textContent = `What does “${w.word}” mean?`;
  const box=document.getElementById('options'); box.innerHTML='';
  choices.forEach(c => {
    const b=document.createElement('button'); b.className='option'; b.textContent=c;
    b.onclick=()=>{
      [...box.children].forEach(x=>x.disabled=true);
      if(c===w.meaning){b.classList.add('correct');qScore++;}
      else {
        b.classList.add('wrong');
        [...box.children].find(x=>x.textContent===w.meaning)?.classList.add('correct');
      }
      qIndex++;
      document.getElementById('quizProgress').textContent = `Score: ${qScore} / ${qIndex}`;
      document.getElementById('nextQuiz').classList.remove('hidden');
    };
    box.appendChild(b);
  });
  document.getElementById('nextQuiz').classList.add('hidden');
}
document.getElementById('nextQuiz').onclick=renderQuiz;

document.getElementById('addBtn').onclick=()=>{
  const nw={
    word:document.getElementById('newWord').value.trim(),
    meaning:document.getElementById('newMeaning').value.trim(),
    turkish:document.getElementById('newHook').value.trim(),
    mnemonic:document.getElementById('newMnemonic').value.trim()
  };
  if(!nw.word||!nw.meaning||!nw.turkish) return alert('Please enter word, meaning and Turkish sound similarity.');
  custom.push(nw); localStorage.setItem('satCustomWords',JSON.stringify(custom)); words=[...starter,...custom];
  ['newWord','newMeaning','newHook','newMnemonic'].forEach(id=>document.getElementById(id).value='');
  renderCard(); renderList(); alert('Word added.');
};

document.querySelectorAll('.tab').forEach(btn=>btn.onclick=()=>{
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active')); btn.classList.add('active');
  ['cards','list','quiz','add'].forEach(id=>document.getElementById(id).classList.add('hidden'));
  document.getElementById(btn.dataset.tab).classList.remove('hidden');
  if(btn.dataset.tab==='list')renderList();
  if(btn.dataset.tab==='quiz')renderQuiz();
});

renderCard();
</script>
</body>
</html>
